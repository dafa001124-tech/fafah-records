  </div>
  <script>
    (() => {
      const loader = document.getElementById('site-loader');
      const started = performance.now();
      let finished = false;
      const watchdog = setTimeout(() => {
        if (finished) return;
        loader.dataset.failed = 'true';
        loader.setAttribute('aria-label', '加载时间较长，可以刷新重试');
        loader.querySelector('.loading-error').hidden = false;
      }, 30000);
      function reveal(failed) {
        if (finished) return;
        finished = true;
        clearTimeout(watchdog);
        setTimeout(() => {
          document.body.removeAttribute('data-loading');
          loader.dataset.leaving = 'true';
          setTimeout(() => loader.remove(), 450);
        }, failed ? 0 : Math.max(0, 1100 - (performance.now() - started)));
      }
      document.addEventListener('portfolio-ready', () => reveal(false), {once:true});
      document.addEventListener('portfolio-error', () => reveal(true), {once:true});
    })();
  </script>
